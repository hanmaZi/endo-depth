# v3 Ablation 3/4 : LoRA + Normales 3D seules sur Lot 2 C3VD (hyperparamètres v2)

experiment_name: "c3vd_cv_sigmoid_norm_only_seed42"
seed: 42
device: "auto"

paths:
  data_dir: "data"
  results_dir: "results"
  checkpoint_dir: "results/c3vd_cv_sigmoid_norm_only_seed42/checkpoints"

data:
  dataset_name: "c3vd"
  dataset_path: null
  image_size: [252, 252]
  min_depth_mm: 1.0
  max_depth_mm: 100.0
  val_ratio: 0.15
  test_ratio: 0.15
  split_by: "model"
  expected_sequences:
    - "cecum_t1_a"
    - "cecum_t2_a"
    - "desc_t4_a"
    - "sigmoid_t2_a"
    - "sigmoid_t3_a"
    - "trans_t1_a"
    - "trans_t2_a"
    - "trans_t3_a"
    - "trans_t3_b"
  selected_sequences: null
  sequence_splits:
    train: ["cecum_t1_a", "cecum_t2_a", "trans_t1_a", "trans_t2_a", "trans_t3_a", "trans_t3_b"]
    val: ["desc_t4_a"]
    test: ["sigmoid_t2_a", "sigmoid_t3_a"]
  batch_size: 4
  num_workers: 2
  augment: true
  color_augment: true

model:
  name: "depth_anything_v2_lora"
  pretrained_id: "depth-anything/Depth-Anything-V2-Small-hf"
  mode: "metric"
  use_lora: true
  train_neck: false
  train_head: true
  lora:
    rank: 8
    alpha: 16.0
    dropout: 0.05
    targets: ["q_proj", "v_proj"]

loss:
  w_l1: 1.0
  w_silog: 1.0
  w_grad: 0.0
  w_normal: 0.25
  use_gt_normals: false
  fx: null
  fy: null

training:
  epochs: 12
  learning_rate: 5.0e-5
  weight_decay: 1.0e-2
  lr_scheduler: "cosine"
  use_amp: true
  grad_clip_norm: 1.0
  save_every_n_epochs: 1
  resume_from: null

evaluation:
  split: "test"
  pred_is_disparity: false
  align_mode: "median"
  min_depth: 1.0
  max_depth: 100.0
